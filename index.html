.w{max-width:820px;margin:0 auto;padding:16px}h1{font-size:22px;margin:0 0 4px}
input[type=password],input[type=text],input[type=date],input[type=number],select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;max-width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.alert{background:var(--bw);border:1px solid var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:12px}.alert b{color:var(--bad)}.alert ul{margin:6px 0 0 18px;padding:0}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{flex:1;min-width:84px;padding:10px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;cursor:pointer;font:inherit;font-size:13px}
.tab.on{background:var(--ch);color:#fff;border-color:var(--ch);box-shadow:inset 0 -3px 0 var(--cy)}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--ok))}
.it{padding:8px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.row{display:flex;align-items:center;gap:8px}.row input[type=checkbox]{width:20px;height:20px;flex:none}
.t{flex:1;cursor:pointer}.done .t{text-decoration:line-through;color:var(--mu)}
.due{font-size:12px;color:var(--mu);white-space:nowrap}.due.od{color:var(--bad);font-weight:600}.due input{width:52px;padding:3px}
button.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px}

.add{display:flex;gap:8px;margin-top:10px}.add input{flex:1}
.nt{margin:6px 0 2px 28px}.nt textarea{width:100%;min-height:60px;margin-top:6px}.nt input{width:100%}
.lead{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}.lead h4{margin:0 0 2px;font-size:15px}.lead p{margin:4px 0;white-space:pre-wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.g2{grid-template-columns:1fr}}
textarea{width:100%;min-height:70px}.m{color:var(--mu);font-size:13px}
.ev{display:flex;align-items:center;gap:10px;cursor:pointer}.ev .n{flex:1}.ev b{font-size:16px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}.pill.b{background:var(--bw);color:var(--bad)}
.hd{display:flex;gap:8px;align-items:center;margin-bottom:10px}.at{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}.at img{height:64px;border-radius:6px;border:1px solid var(--bd);display:block}.at a{font-size:13px;color:var(--ac)}.at .f{position:relative}.at .f button{position:absolute;top:-7px;right:-7px;background:var(--card);border:1px solid var(--bd);border-radius:50%;width:20px;height:20px;line-height:16px;padding:0;font-size:13px;cursor:pointer;color:var(--mu)}.up{font-size:13px;color:var(--ac);cursor:pointer;border:1px dashed var(--bd);border-radius:8px;padding:5px 10px}

.lg{background:#fff;border-radius:10px;padding:6px;display:flex}.lg img{height:54px;width:auto;display:block}
.bt{color:#fff;font-weight:800;letter-spacing:.06em;font-size:20px;line-height:1.1}.bt span{color:var(--cy);display:block;font-size:14px;letter-spacing:.14em;font-weight:700;margin-top:3px}
.bs{color:#c3c7ce;font-size:12px;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}@media(max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}

.card.ev:hover{border-color:var(--cy)}
